<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <style>
    .wave1 { animation: drift 9s linear infinite; }
    .wave2 { animation: drift 14s linear infinite reverse; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-600px); } }
    .star { animation: twinkle 3s ease-in-out infinite; }
    .s2 { animation-delay: .6s; } .s3 { animation-delay: 1.2s; } .s4 { animation-delay: 1.8s; } .s5 { animation-delay: 2.4s; }
    @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    .title { font: 700 54px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: url(#name);
             animation: rise 1.2s ease-out .2s backwards; }
    .sub { font: 500 22px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #e0f2fe; letter-spacing: 1px;
           animation: rise 1.2s ease-out .8s backwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <g fill="#ffffff">
      <circle class="star" cx="90" cy="45" r="2"/>
      <circle class="star s2" cx="240" cy="90" r="1.6"/>
      <circle class="star s3" cx="410" cy="35" r="2.2"/>
      <circle class="star s4" cx="820" cy="50" r="1.8"/>
      <circle class="star s5" cx="980" cy="95" r="2"/>
      <circle class="star s2" cx="1110" cy="40" r="1.6"/>
      <circle class="star s3" cx="640" cy="22" r="1.5"/>
      <circle class="star s4" cx="160" cy="150" r="1.4"/>
      <circle class="star s5" cx="1060" cy="160" r="1.4"/>
    </g>
    <g class="wave2">
      <path fill="url(#w2)" d="M0 205 Q 75 180 150 205 T 300 205 T 450 205 T 600 205 T 750 205 T 900 205 T 1050 205 T 1200 205 T 1350 205 T 1500 205 T 1650 205 T 1800 205 V 260 H 0 Z"/>
    </g>
    <g class="wave1">
      <path fill="url(#w1)" d="M0 222 Q 100 200 200 222 T 400 222 T 600 222 T 800 222 T 1000 222 T 1200 222 T 1400 222 T 1600 222 T 1800 222 V 260 H 0 Z"/>
    </g>
    <text class="title" x="600" y="118" text-anchor="middle">Nguyen Duc Quyen</text>
    <text class="sub" x="600" y="162" text-anchor="middle">Full-stack Developer · Admin Dashboards &amp; REST APIs</text>
  </g>
</svg>
